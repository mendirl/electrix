services:
  postgres:
    #    image: postgres
    image: dhi.io/postgres:18-dev
    environment:
      POSTGRES_PASSWORD: electrix
      POSTGRES_USER: electrix
    ports:
      - "5431:5432"

  clickhouse:
    #        image: clickhouse
    image: dhi.io/clickhouse-server:25-dev
    hostname: clickhouse
    container_name: clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    environment:
      CLICKHOUSE_USER: electrix
      CLICKHOUSE_PASSWORD: electrix

  kafka:
    #    image: apache/kafka
    image: dhi.io/kafka:4-dev
    container_name: shop-kafka
    ports:
      - "9092:9092"

  keycloak:
    #        image: keycloak/keycloak
    image: dhi.io/keycloak:26-dev
    hostname: keycloak
    container_name: keycloak
    restart: always
    command: start-dev
    ports:
      - "8081:8080"
      - "8443:8443"
      - "9001:9000"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

